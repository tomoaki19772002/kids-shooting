<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SYU & RYO サボテン大作戦</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:system-ui,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);--u:1px}
canvas{display:block;width:100%;height:100%;touch-action:none}
.btn{position:absolute;margin:0;padding:0;border:0;color:#fff;font-weight:bold;touch-action:manipulation;cursor:pointer;-webkit-appearance:none}
#swap{right:calc(var(--u)*12);bottom:calc(var(--u)*14);width:calc(var(--u)*70);height:calc(var(--u)*70);border-radius:50%;background:#fff;border:calc(var(--u)*4) solid #ffd23f;box-shadow:0 calc(var(--u)*3) calc(var(--u)*8) rgba(0,0,0,.45);overflow:visible}
#swap img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;pointer-events:none}
#swap span{position:absolute;left:50%;bottom:calc(var(--u)*-10);transform:translateX(-50%);font-size:calc(var(--u)*12);background:#ff5a5f;border-radius:calc(var(--u)*10);padding:calc(var(--u)*2) calc(var(--u)*8);white-space:nowrap;pointer-events:none}
#mute{right:calc(var(--u)*8);top:calc(var(--u)*8);width:calc(var(--u)*36);height:calc(var(--u)*36);border-radius:50%;background:rgba(0,0,0,.35);font-size:calc(var(--u)*18)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <button id="swap" class="btn hide" aria-label="こうたい"><img id="swapimg" alt=""><span>こうたい</span></button>
  <button id="mute" class="btn" aria-label="サウンド">🔊</button>
</div>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const swapBtn=document.getElementById('swap'),swapImg=document.getElementById('swapimg'),muteBtn=document.getElementById('mute');

/* ---------- 画面サイズ ---------- */
let cScale=1;
function resize(){
  const iw=innerWidth,ih=innerHeight;
  let w=ih*W/H,h=ih;
  if(w>iw){w=iw;h=iw*H/W;}
  wrap.style.width=w+'px';wrap.style.height=h+'px';
  wrap.style.setProperty('--u',(w/W)+'px');
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cScale=cv.width/W;
}
addEventListener('resize',resize);resize();

const faces={};
for(const k in FACE_SRC){const i=new Image();i.src=FACE_SRC[k];faces[k]=i;}
const CHAR={
  syu:{name:'SYU',color:'#ff9d2e',interval:15,other:'ryo'},
  ryo:{name:'RYO',color:'#39a7ff',interval:9,other:'syu'}
};
function drawFace(k,x,y,r){
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=CHAR[k].color;ctx.fill();
  const im=faces[k];
  if(im.complete&&im.naturalWidth){
    ctx.save();ctx.beginPath();ctx.arc(x,y,r-2,0,7);ctx.clip();
    ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore();
  }
  ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}

let AC=null,muted=false;
try{muted=localStorage.getItem('sr_mute')==='1';}catch(e){}
muteBtn.textContent=muted?'🔇':'🔊';
function audioInit(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function beep(f,d,type,v,slide){
  if(!AC||muted)return;
  const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);
  g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);
}
const sfx={
  shoot(){beep(900,.04,'square',.015,-300);},
  hit(){beep(260,.07,'square',.04,-120);},
  boom(){beep(160,.22,'sawtooth',.07,-110);},
  item(){beep(660,.08,'triangle',.07,0);setTimeout(()=>beep(990,.12,'triangle',.07,0),70);},
  hurt(){beep(220,.35,'sawtooth',.09,-170);},
  swap(){beep(500,.08,'triangle',.07,500);},
  warn(){beep(330,.25,'square',.06,-60);setTimeout(()=>beep(330,.25,'square',.06,-60),300);},
  over(){beep(400,.5,'triangle',.08,-300);}
};
muteBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';
  try{localStorage.setItem('sr_mute',muted?'1':'0');}catch(err){}
  audioInit();
});

/* ---------- ゲーム状態 ---------- */
let state='title',paused=false,t=0,frame=0;
let score=0,hi=0,newRecord=false,lv=0,shake=0;
try{hi=+localStorage.getItem('sr_hi')||0;}catch(e){}
let P,bullets,enemies,ebul,items,parts,pops,boss,nextSpawn,nextBoss,bossCount;
const deco=[];
for(let i=0;i<20;i++)deco.push(newDeco(true));
function newDeco(init){
  const near=Math.random()<.4;
  const pick=['🌵','🌵','🌵','🌴','🌾','🌼'];
  return{x:Math.random()*W,y:init?Math.random()*H:-40,e:pick[Math.floor(Math.random()*pick.length)],
    s:near?44:26,sp:near?2.2:1.1,a:near?1:.7};
}
function reset(){
  P={x:W/2,y:H-140,tx:W/2,ty:H-140,qx:W/2-44,qy:H-120,lead:'syu',life:3,power:1,inv:0,f1:0,f2:10,swapFx:0};
  bullets=[];enemies=[];ebul=[];items=[];parts=[];pops=[];boss=null;
  nextSpawn=50;nextBoss=60*45;bossCount=0;score=0;lv=0;frame=0;shake=0;newRecord=false;
  swapImg.src=FACE_SRC[CHAR[P.lead].other];
}
reset();

function start(){
  audioInit();reset();state='play';paused=false;
  swapBtn.classList.remove('hide');
  pop(W/2,H/2-40,'スタート！','#fff',50,34);
}
function gameOver(){
  state='over';t=0;sfx.over();swapBtn.classList.add('hide');
  if(score>hi){hi=score;newRecord=true;try{localStorage.setItem('sr_hi',String(hi));}catch(e){}}
}
function swap(){
  if(state!=='play'||paused)return;
  P.lead=CHAR[P.lead].other;
  swapImg.src=FACE_SRC[CHAR[P.lead].other];
  P.swapFx=18;sfx.swap();
  pop(P.x,P.y-40,CHAR[P.lead].name+'！',CHAR[P.lead].color,40,22);
}
swapBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();swap();});

/* ---------- 入力 ---------- */
let ptr=null,ox=0,oy=0,sx=0,sy=0;
const keys={};
function toLogic(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  if(state==='title'){start();return;}
  if(state==='over'){if(t>50)start();return;}
  if(paused){paused=false;return;}
  if(ptr!==null)return;
  ptr=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(err){}
  [ox,oy]=toLogic(e);sx=P.tx;sy=P.ty;
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==ptr)return;
  const[x,y]=toLogic(e);
  P.tx=sx+(x-ox)*1.25;P.ty=sy+(y-oy)*1.25;
});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{if(e.pointerId===ptr)ptr=null;}));
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();audioInit();
    if(state==='title')start();else if(state==='over'){if(t>50)start();}else if(e.key===' ')swap();
  }
  if(e.key==='Shift'&&state==='play')swap();
});
addEventListener('keyup',e=>{keys[e.key]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true;});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- 敵 ---------- */
const TYPES={
  bug: {e:'🐛',hp:2,sp:1.5,r:15,sc:10},
  bat: {e:'🦇',hp:1,sp:2.4,r:14,sc:20},
  bee: {e:'🐝',hp:2,sp:1.9,r:14,sc:25},
  scor:{e:'🦂',hp:6,sp:1.0,r:18,sc:40}
};
function spawn(){
  const r=Math.random();
  let k='bug';
  if(lv>=1&&r<.22)k='scor';
  else if(r<.42)k='bat';
  else if(lv>=1&&r<.62)k='bee';
  const d=TYPES[k];
  enemies.push({k,e:d.e,x:30+Math.random()*(W-60),y:-30,hp:d.hp+Math.floor(lv/2),sp:d.sp+lv*.08,r:d.r,sc:d.sc,age:0,hit:0,sh:60+Math.random()*60,x0:0});
}
function spawnBoss(){
  bossCount++;
  const hp=70+45*bossCount;
  boss={k:'boss',e:['🦖','🐙','🐲'][(bossCount-1)%3],x:W/2,y:-90,hp,max:hp,sp:0,r:44,sc:1000*bossCount,age:0,hit:0,sh:60};
  enemies.push(boss);
  pop(W/2,H/2,'WARNING!','#ff4444',90,38);sfx.warn();shake=12;
}
function ebullet(x,y,a,sp,r){ebul.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:r||5});}
function aimAt(x,y){return Math.atan2(P.y-y,P.x-x);}

/* ---------- 発射 ---------- */
function fireFor(k,x,y,pw){
  if(k==='syu'){
    const n=pw+1;
    for(let i=0;i<n;i++){
      const a=(i-(n-1)/2)*.17;
      bullets.push({x,y:y-14,vx:Math.sin(a)*10,vy:-Math.cos(a)*10,dmg:1,r:4,k});
    }
  }else{
    const n=1+(pw>>1);
    for(let i=0;i<n;i++)bullets.push({x:x+(i-(n-1)/2)*11,y:y-16,vx:0,vy:-13,dmg:2,r:4,k});
  }
}

/* ---------- 演出 ---------- */
function pop(x,y,s,c,life,size){pops.push({x,y,s,c,life:life||40,max:life||40,size:size||16});}
function explode(x,y,n,c){
  for(let i=0;i<n;i++){
    const a=Math.random()*7,s=1+Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,max:40,c:c||'#ffd23f',r:2+Math.random()*3});
  }
}
function drop(x,y,force){
  if(!force&&Math.random()>.13)return;
  const heart=force==='heart'||(!force&&Math.random()<.35);
  items.push({x,y,vy:1.4,type:heart?'heart':'star',r:13,age:0});
}
function kill(e){
  score+=e.sc;sfx.boom();
  if(e===boss){
    explode(e.x,e.y,70,'#ff8a3d');explode(e.x,e.y,40,'#fff');
    shake=22;boss=null;nextBoss=frame+60*50;
    ebul=[];drop(e.x-30,e.y,'heart');drop(e.x+30,e.y,'star');
    pop(e.x,e.y,'BOSS撃破！ +'+e.sc,'#ffd23f',90,26);
  }else{
    explode(e.x,e.y,12,'#ffe27a');
    if(e.sc>=40)pop(e.x,e.y,'+'+e.sc,'#fff',30,16);
    drop(e.x,e.y);
  }
}
function hurt(){
  if(P.inv>0)return;
  P.life--;P.inv=120;shake=14;sfx.hurt();
  P.power=Math.max(1,P.power-1);ebul=[];
  explode(P.x,P.y,25,CHAR[P.lead].color);
  if(P.life<=0)gameOver();
}

/* ---------- 更新 ---------- */
function updateDeco(){
  for(let i=0;i<deco.length;i++){
    const d=deco[i];d.y+=d.sp;
    if(d.y>H+40)deco[i]=newDeco(false);
  }
}
function update(){
  updateDeco();
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life--;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=.6;p.life--;}
  pops=pops.filter(p=>p.life>0);
  if(shake>0)shake--;
  if(state==='over'){t++;return;}
  if(state!=='play'){t++;return;}
  if(paused)return;
  frame++;

  // lv
  const nl=Math.floor(frame/1800);
  if(nl>lv){lv=nl;pop(W/2,H/2-60,'LEVEL '+(lv+1),'#fff',70,30);}

  // 移動
  const sp=6;
  if(keys.ArrowLeft||keys.a)P.tx-=sp;
  if(keys.ArrowRight||keys.d)P.tx+=sp;
  if(keys.ArrowUp||keys.w)P.ty-=sp;
  if(keys.ArrowDown||keys.s)P.ty+=sp;
  P.tx=Math.max(22,Math.min(W-22,P.tx));
  P.ty=Math.max(80,Math.min(H-28,P.ty));
  P.x+=(P.tx-P.x)*.3;P.y+=(P.ty-P.y)*.3;
  const qs=P.x<70?1:-1;
  P.qx+=(P.x+qs*46-P.qx)*.18;P.qy+=(P.y+22-P.qy)*.18;
  if(P.inv>0)P.inv--;
  if(P.swapFx>0)P.swapFx--;

  // 発射
  if(--P.f1<=0){fireFor(P.lead,P.x,P.y,P.power);P.f1=CHAR[P.lead].interval;if(frame%3===0)sfx.shoot();}
  if(--P.f2<=0){const o=CHAR[P.lead].other;fireFor(o,P.qx,P.qy,Math.max(1,P.power-1));P.f2=CHAR[o].interval+5;}

  // 敵出現
  if(!boss&&frame>=nextBoss)spawnBoss();
  if(--nextSpawn<=0){
    const base=Math.max(22,62-lv*6);
    nextSpawn=boss?base*2.5:base;
    spawn();
  }

  // 弾
  for(const b of bullets){b.x+=b.vx;b.y+=b.vy;}
  bullets=bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  for(const b of ebul){b.x+=b.vx;b.y+=b.vy;}
  ebul=ebul.filter(b=>b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);

  // 敵
  for(const e of enemies){
    e.age++;if(e.hit>0)e.hit--;
    if(e===boss){
      if(e.y<110)e.y+=1.2;
      else{
        e.x=W/2+Math.sin(e.age*.018)*105;e.y=110+Math.sin(e.age*.03)*14;
        if(--e.sh<=0){
          e.sh=Math.max(45,85-bossCount*8);
          const n=5+bossCount*2;
          for(let i=0;i<n;i++)ebullet(e.x,e.y+30,Math.PI/2+(i-(n-1)/2)*.28,2.6);
          if(e.age%2===0)for(let i=-1;i<=1;i++)ebullet(e.x,e.y+30,aimAt(e.x,e.y)+i*.12,3.4,6);
        }
      }
      continue;
    }
    e.y+=e.sp;
    if(e.k==='bug')e.x+=Math.sin(e.age*.05)*1.0;
    else if(e.k==='bat')e.x+=Math.sin(e.age*.12)*2.6;
    else if(e.k==='bee')e.x+=Math.max(-.9,Math.min(.9,P.x-e.x));
    else if(e.k==='scor'&&e.y>0&&e.y<H*.6&&--e.sh<=0){
      e.sh=Math.max(60,115-lv*8);ebullet(e.x,e.y+10,aimAt(e.x,e.y),2.7);
    }
  }

  // 弾 vs 敵
  for(const b of bullets){
    if(b.dead)continue;
    for(const e of enemies){
      if(e.hp<=0||e.y<5)continue;
      const dx=b.x-e.x,dy=b.y-e.y,rr=e.r+b.r;
      if(dx*dx+dy*dy<rr*rr){
        e.hp-=b.dmg;e.hit=4;b.dead=true;
        if(e.hp>0)sfx.hit();
        else kill(e);
        break;
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  enemies=enemies.filter(e=>e.hp>0&&e.y<H+40);

  // 敵 vs プレイヤー
  const hr=8;
  for(const e of enemies){
    const dx=P.x-e.x,dy=P.y-e.y,rr=e.r*.85+hr;
    if(dx*dx+dy*dy<rr*rr&&P.inv<=0){
      hurt();
      if(e!==boss){e.hp=0;explode(e.x,e.y,10);}
      break;
    }
  }
  enemies=enemies.filter(e=>e.hp>0);
  for(const b of ebul){
    const dx=P.x-b.x,dy=P.y-b.y,rr=b.r+hr;
    if(dx*dx+dy*dy<rr*rr&&P.inv<=0){hurt();break;}
  }
  if(state!=='play')return;

  // アイテム
  for(const it of items){
    it.y+=it.vy;it.age++;
    const dx=P.x-it.x,dy=P.y-it.y;
    const dx2=P.qx-it.x,dy2=P.qy-it.y;
    if(dx*dx+dy*dy<30*30||dx2*dx2+dy2*dy2<24*24){
      it.dead=true;sfx.item();
      if(it.type==='star'){
        if(P.power<5){P.power++;pop(it.x,it.y,'POWER UP!','#ffd23f',50,18);}
        else{score+=200;pop(it.x,it.y,'+200','#fff',30,16);}
      }else{
        if(P.life<5){P.life++;pop(it.x,it.y,'LIFE UP!','#ff6b8b',50,18);}
        else{score+=300;pop(it.x,it.y,'+300','#fff',30,16);}
      }
    }
  }
  items=items.filter(i=>!i.dead&&i.y<H+30);
}

/* ---------- 描画 ---------- */
function txt(s,x,y,size,fill,align,stroke,lw){
  ctx.font='bold '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=lw||4;ctx.strokeStyle=stroke||'#000';
  ctx.strokeText(s,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y);
}
function emo(e,x,y,s){ctx.font=s+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,x,y);}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7fd6ff');g.addColorStop(.45,'#d8f3ff');g.addColorStop(.55,'#f9e3a8');g.addColorStop(1,'#e8b765');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const d of deco){ctx.globalAlpha=d.a;emo(d.e,d.x,d.y,d.s);}
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const blink=P.inv>0&&Math.floor(P.inv/4)%2===0;
  const o=CHAR[P.lead].other;
  ctx.globalAlpha=blink?.35:1;
  drawFace(o,P.qx,P.qy,16);
  const sc=1+P.swapFx*.02;
  ctx.save();ctx.translate(P.x,P.y);ctx.scale(sc,sc);
  drawFace(P.lead,0,0,23);ctx.restore();
  ctx.globalAlpha=1;
  txt(CHAR[P.lead].name,P.x,P.y+35,11,CHAR[P.lead].color,'center','#000',3);
}
function drawBullet(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
  ctx.fillStyle=CHAR[b.k].color;ctx.fillRect(-2.5,-9,5,16);
  ctx.fillStyle='#fff';ctx.fillRect(-1,-9,2,16);
  ctx.beginPath();ctx.moveTo(-3,-9);ctx.lineTo(3,-9);ctx.lineTo(0,-16);ctx.closePath();
  ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}
function drawHud(){
  txt('SCORE '+score,10,22,20,'#fff','left');
  txt('HI '+hi,10,44,13,'#ffe9a8','left','#000',3);
  for(let i=0;i<P.life;i++)emo('❤️',20+i*24,70,20);
  let s='';for(let i=0;i<5;i++)s+=i<P.power?'★':'☆';
  txt('POW '+s,W-10,70,14,'#ffd23f','right','#000',3);
  if(boss&&boss.y>0){
    const w=240,x=(W-w)/2,y=94;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x-2,y-2,w+4,12);
    ctx.fillStyle='#ff4d4d';ctx.fillRect(x,y,w*Math.max(0,boss.hp)/boss.max,8);
  }
}
function drawScene(){
  drawBg();
  for(const it of items){
    const bob=Math.sin(it.age*.15)*2;
    emo(it.type==='star'?'⭐':'❤️',it.x,it.y+bob,26);
  }
  for(const e of enemies){
    ctx.globalAlpha=e.hit>0?.5:1;
    emo(e.e,e.x,e.y,e.r*2.1);
  }
  ctx.globalAlpha=1;
  for(const b of bullets)drawBullet(b);
  for(const b of ebul){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle='#ff3b30';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  }
  if(state==='play'||state==='over'&&P.life>0)drawPlayer();
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.min(1,p.life/(p.max*.4));txt(p.s,p.x,p.y,p.size,p.c);}
  ctx.globalAlpha=1;
}
function drawTitle(){
  const bob=Math.sin(t*.07)*6;
  txt('SYU & RYO',W/2,92,46,'#fff','center','#2e7d32',8);
  txt('サボテン大作戦',W/2,148,34,'#ffd23f','center','#8a4b00',7);
  drawFace('syu',W/2-70,262+bob,62);
  drawFace('ryo',W/2+70,262-bob,62);
  txt('SYU',W/2-70,340,18,CHAR.syu.color,'center','#000',4);
  txt('RYO',W/2+70,340,18,CHAR.ryo.color,'center','#000',4);
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();ctx.roundRect?ctx.roundRect(30,372,W-60,120,14):ctx.rect(30,372,W-60,120);ctx.fill();
  txt('ゆびをドラッグして いどう',W/2,398,16,'#fff','center','#000',3);
  txt('はっしゃは じどう！',W/2,424,16,'#fff','center','#000',3);
  txt('「こうたい」ボタンで',W/2,452,16,'#ffe9a8','center','#000',3);
  txt('SYU ⇄ RYO チェンジ！',W/2,476,16,'#ffe9a8','center','#000',3);
  if(Math.floor(t/30)%2===0)txt('TAP TO START',W/2,550,30,'#fff','center','#d32f2f',6);
  txt('HI SCORE '+hi,W/2,598,16,'#fff','center','#000',3);
}
function drawOver(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
  txt('GAME OVER',W/2,170,46,'#ff5a5f','center','#fff',7);
  drawFace('syu',W/2-58,260,42);drawFace('ryo',W/2+58,260,42);
  txt('SCORE '+score,W/2,350,32,'#fff','center','#000',5);
  if(newRecord)txt('NEW RECORD!!',W/2,392,26,'#ffd23f','center','#000',5);
  else txt('HI '+hi,W/2,392,20,'#ffe9a8','center','#000',4);
  if(t>50&&Math.floor(t/30)%2===0)txt('TAPで もういちど',W/2,480,26,'#fff','center','#000',5);
}
function draw(){
  ctx.setTransform(cScale,0,0,cScale,0,0);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*.7,(Math.random()-.5)*shake*.7);
  drawScene();
  ctx.restore();
  if(state==='play')drawHud();
  if(state==='title')drawTitle();
  if(state==='over')drawOver();
  if(paused&&state==='play'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    txt('PAUSE',W/2,H/2-20,44,'#fff');
    txt('TAPで さいかい',W/2,H/2+30,22,'#fff');
  }
}

/* ---------- ループ ---------- */
let last=performance.now(),acc=0;
function loop(now){
  requestAnimationFrame(loop);
  let d=now-last;last=now;if(d>100)d=100;
  acc+=d;
  while(acc>=16.667){update();acc-=16.667;}
  draw();
}
requestAnimationFrame(loop);
})();
</script>
