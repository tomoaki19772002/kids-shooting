const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const muteBtn=document.getElementById('mute');

/* ---------- 画面サイズ ---------- */
let cScale=1;
function resize(){
  const iw=innerWidth,ih=innerHeight;
  let w=ih*W/H,h=ih;
  if(w>iw){w=iw;h=iw*H/W;}
  wrap.style.width=w+'px';wrap.style.height=h+'px';
  wrap.style.setProperty('--u',(w/W)+'px');
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cScale=cv.width/W;
}
addEventListener('resize',resize);resize();

const CHAR={
  syu:{name:'SYU',color:'#ff9d2e',interval:12},
  ryo:{name:'RYO',color:'#39a7ff',interval:8}
};
function drawFace(k,x,y,r){
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=CHAR[k].color;ctx.fill();
  const im=faces[k];
  if(im.complete&&im.naturalWidth){
    ctx.save();ctx.beginPath();ctx.arc(x,y,r-2,0,7);ctx.clip();
    ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore();
  }
  ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}

let AC=null,muted=false;
try{muted=localStorage.getItem('sr_mute')==='1';}catch(e){}
muteBtn.textContent=muted?'🔇':'🔊';
function audioInit(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function beep(f,d,type,v,slide){
  if(!AC||muted)return;
  const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);
  g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);
}

/* ---------- BGM(かんたんな ループ曲) ---------- */
// mel: 8分音符×32歩(2小節)のMIDIノート、0は休み / bass: 2歩ごと
const TRACKS=[
  {bpm:132,lead:'square',
   mel:[76,0,79,76, 74,0,72,0, 74,76,74,72, 69,0,72,0, 76,0,79,81, 79,0,76,0, 74,72,74,76, 72,0,0,0],
   bass:[48,48,43,43, 45,45,41,41, 48,48,43,43, 45,41,48,48]},
  {bpm:140,lead:'triangle',
   mel:[69,0,72,0, 76,0,74,72, 69,0,72,74, 76,0,0,0, 79,0,76,0, 74,0,72,69, 71,0,72,74, 69,0,0,0],
   bass:[45,45,45,45, 41,41,43,43, 45,45,45,45, 41,41,40,40]},
  {bpm:150,lead:'square',
   mel:[74,77,79,81, 79,77,74,0, 72,74,77,79, 77,74,72,0, 74,77,79,81, 84,81,79,77, 79,77,74,72, 74,0,0,0],
   bass:[50,50,50,50, 48,48,48,48, 46,46,48,48, 50,50,50,50]},
  {bpm:168,lead:'sawtooth',  // ボス用
   mel:[76,76,0,76, 79,0,76,0, 83,0,79,0, 76,0,74,0, 76,76,0,76, 79,0,83,0, 86,0,83,0, 79,76,74,71],
   bass:[40,40,40,40, 43,43,43,43, 38,38,38,38, 40,40,45,47]}
];
let curTrack=-1,mStep=0,mNext=0;
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function note(m,when,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(vol,when+.01);
  g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(AC.destination);o.start(when);o.stop(when+dur+.02);
}
function kick(when){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,when);o.frequency.exponentialRampToValueAtTime(40,when+.1);
  g.gain.setValueAtTime(.09,when);g.gain.exponentialRampToValueAtTime(.0001,when+.12);
  o.connect(g);g.connect(AC.destination);o.start(when);o.stop(when+.14);
}
function musicPump(){
  if(!AC||curTrack<0||muted||AC.state!=='running')return;
  const tr=TRACKS[curTrack];
  const bpm=tr.bpm*(1+.04*Math.floor((stage-1)/3));
  const sd=60/bpm/2;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.2){
    const m=tr.mel[mStep];
    if(m)note(m,mNext,sd*1.6,tr.lead,tr.lead==='sawtooth'?.022:.03);
    if(mStep%2===0){const b=tr.bass[mStep>>1];if(b)note(b,mNext,sd*1.9,'triangle',.07);}
    if(mStep%4===0)kick(mNext);
    mNext+=sd;mStep=(mStep+1)%32;
  }
}
setInterval(musicPump,50);
function setTrack(i){
  if(i===curTrack)return;
  curTrack=i;mStep=0;if(AC)mNext=AC.currentTime+.05;
}

/* ---------- 入力 ---------- */
let ptr=null,ox=0,oy=0,sx=0,sy=0;
const keys={};
function toLogic(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  const[x,y]=toLogic(e);
  if(state==='title'){
    if(y>340&&y<410){
      const i=Math.floor((x-28)/104);
      if(i>=0&&i<3&&x<=332&&DKEYS[i]!==diff)setDiff(DKEYS[i]);
    }else if(y>170&&y<335)start(x<W/2?'syu':'ryo');
    return;
  }
  if(state==='over'){if(t>50){reset();state='title';t=0;}return;}
  if(paused){paused=false;return;}
  if(ptr!==null)return;
  ptr=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(err){}
  ox=x;oy=y;sx=P.tx;sy=P.ty;
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==ptr)return;
  const[x,y]=toLogic(e);
  P.tx=sx+(x-ox)*1.25;P.ty=sy+(y-oy)*1.25;
});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{if(e.pointerId===ptr)ptr=null;}));
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='Enter'||e.key==='1'||e.key==='2'){
    e.preventDefault();audioInit();
    if(state==='title')start(e.key==='2'?'ryo':e.key==='1'?'syu':lastWho);
    else if(state==='over'&&t>50){reset();state='title';t=0;}
  }
});

/* ---------- 敵 ---------- */
function spawn(){
  const allowed=th(stage).pool.filter((p,i)=>i<=1||stageFrame>=(i-1)*600);
  let tot=0;for(const p of allowed)tot+=p[1];
  let r=Math.random()*tot,k=allowed[0][0];
  for(const p of allowed){r-=p[1];if(r<=0){k=p[0];break;}}
  const d=TYPES[k];
  enemies.push({k,e:d.e,x:30+Math.random()*(W-60),y:-30,
    hp:Math.max(1,Math.ceil((d.hp+Math.floor((stage-1)*.8))*D.hp)),sp:d.sp+Math.min(1,(stage-1)*.08),r:d.r,sc:d.sc,
    age:0,hit:0,sh:(d.sh||0)*D.efire*(.5+Math.random()*.5),dir:Math.random()<.5?-1:1,dv:0});
}
function spawnBoss(){
  const hp=Math.round((70+45*stage)*D.boss);
  boss={k:'boss',e:th(stage).boss,x:W/2,y:-90,hp,max:hp,sp:0,r:44,sc:1000*stage,age:0,hit:0,sh:60};
  enemies.push(boss);
  pop(W/2,H/2,'WARNING!','#ff4444',90,38);sfx.warn();shake=12;
}
function ebullet(x,y,a,sp,r){const m=sp*D.bul;ebul.push({x,y,vx:Math.cos(a)*m,vy:Math.sin(a)*m,r:r||5});}
function aimAt(x,y){return Math.atan2(P.y-y,P.x-x);}

/* ---------- 発射 ---------- */
function fireFor(k,x,y,pw,h){
  if(k==='syu'){
    const n=pw+2;
    for(let i=0;i<n;i++){
      const a=(i-(n-1)/2)*.17;
      bullets.push({x,y:y-14,vx:Math.sin(a)*10,vy:-Math.cos(a)*10,dmg:1,r:4,k,h,l:0});
    }
  }else{
    const n=1+(pw>>1);
    for(let i=0;i<n;i++)bullets.push({x:x+(i-(n-1)/2)*11,y:y-16,vx:0,vy:-13,dmg:2,r:4,k,h,l:0});
  }
}

/* ---------- アイテム ---------- */
const ITEM_E={star:'⭐',speed:'⚡',shield:'🛡️',bomb:'💣',homing:'🎯',heart:'❤️'};
function addScore(n){score+=Math.round(n*D.score);}
function bomb(){
  flash=18;shake=18;ebul=[];sfx.bomb();
  pop(P.x,P.y-50,'BOMB!','#fff',50,30);
  for(const e of enemies.slice()){
    if(e.hp<=0)continue;
    e.hp-=e===boss?25:10;e.hit=8;
    if(e.hp<=0)kill(e);
  }
  enemies=enemies.filter(e=>e.hp>0);
}
function pickup(it){
  const x=it.x,y=it.y;
  sfx.item();
  switch(it.type){
    case 'star':
      if(P.power<5){P.power++;pop(x,y,'POWER UP!','#ffd23f',50,18);}
      else{addScore(200);pop(x,y,'+200','#fff',30,16);}
      break;
    case 'speed':
      if(P.spd<4){P.spd++;pop(x,y,'れんしゃ UP!','#7fe0ff',50,18);}
      else{addScore(200);pop(x,y,'+200','#fff',30,16);}
      break;
    case 'shield':
      P.shield=true;sfx.shield();pop(x,y,'バリア！','#7dffb0',50,18);
      break;
    case 'homing':
      P.homing=60*10;pop(x,y,'ホーミング！','#ff9ad5',50,18);
      break;
    case 'bomb':
      bomb();
      break;
    default:
      if(P.life<5){P.life++;pop(x,y,'LIFE UP!','#ff6b8b',50,18);}
      else{addScore(300);pop(x,y,'+300','#fff',30,16);}
  }
}

/* ---------- 演出 ---------- */
function pop(x,y,s,c,life,size,vy){pops.push({x,y,s,c,life:life||40,max:life||40,size:size||16,vy:vy===undefined?.6:vy});}
function explode(x,y,n,c){
  for(let i=0;i<n;i++){
    const a=Math.random()*7,s=1+Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,max:40,c:c||'#ffd23f',r:2+Math.random()*3});
  }
}
function drop(x,y,force){
  if(!force&&Math.random()>.11*D.drop)return;
  let type=force;
  if(!type){
    const r=Math.random()*100;
    type=r<22?'star':r<44?'speed':r<58?'shield':r<68?'bomb':r<82?'homing':'heart';
  }
  items.push({x,y,vy:1.4,type,r:13,age:0});
}
function kill(e){
  addScore(e.sc);sfx.boom();
  if(e===boss){
    explode(e.x,e.y,70,'#ff8a3d');explode(e.x,e.y,40,'#fff');
    shake=22;boss=null;ebul=[];
    for(const o of enemies)if(o!==e&&o.hp>0){o.hp=0;explode(o.x,o.y,10);}
    drop(e.x-30,e.y,'heart');drop(e.x+30,e.y,'star');
    addScore(500*stage);clearT=200;sfx.clear();
    pop(e.x,e.y+40,'BOSS撃破！ +'+e.sc,'#ffd23f',90,22);
    pop(W/2,H/2-40,'STAGE '+stage+' CLEAR!','#fff',190,34,.1);
  }else{
    explode(e.x,e.y,12,'#ffe27a');
    if(e.sc>=40)pop(e.x,e.y,'+'+e.sc,'#fff',30,16);
    drop(e.x,e.y);
  }
}
function hurt(){
  if(P.inv>0)return;
  if(P.shield){
    P.shield=false;P.inv=70;sfx.hit();ebul=[];
    explode(P.x,P.y,18,'#7dffb0');pop(P.x,P.y-30,'バリアが われた！','#7dffb0',40,15);
    return;
  }
  P.life--;P.inv=120;shake=14;sfx.hurt();
  P.power=Math.max(1,P.power-1);ebul=[];
  explode(P.x,P.y,25,CHAR[P.who].color);
  if(P.life<=0)gameOver();
}

/* ---------- 更新 ---------- */
function update(){
  for(let i=0;i<deco.length;i++){
    const d=deco[i];d.y+=d.sp;
    if(d.y>H+40)deco[i]=newDeco(false);
  }
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life--;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=p.vy;p.life--;}
  pops=pops.filter(p=>p.life>0);
  if(shake>0)shake--;
  if(bgFade>0)bgFade--;
  if(flash>0)flash--;
  if(state!=='play'){t++;return;}
  if(paused)return;
  frame++;

  // 移動
  const sp=6;
  if(keys.ArrowLeft||keys.a)P.tx-=sp;
  if(keys.ArrowRight||keys.d)P.tx+=sp;
  if(keys.ArrowUp||keys.w)P.ty-=sp;
  if(keys.ArrowDown||keys.s)P.ty+=sp;
  P.tx=Math.max(22,Math.min(W-22,P.tx));
  P.ty=Math.max(80,Math.min(H-28,P.ty));
  P.x+=(P.tx-P.x)*.3;P.y+=(P.ty-P.y)*.3;
  if(P.inv>0)P.inv--;
  if(P.homing>0)P.homing--;

  // 発射
  if(--P.f1<=0){
    fireFor(P.who,P.x,P.y,P.power,P.homing>0);
    P.f1=Math.max(4,Math.round(CHAR[P.who].interval*(1-.14*(P.spd-1))));
    if(frame%3===0)sfx.shoot();
  }

  // 敵出現 / ステージ進行
  if(clearT>0){
    if(--clearT===0)nextStage();
  }else{
    stageFrame++;
    if(!boss&&stageFrame>=BOSS_AT)spawnBoss();
    if(--nextSpawn<=0){
      const base=Math.max(20,62-(stage-1)*5-stageFrame/120)*D.spawn;
      nextSpawn=boss?base*2.5:base;
      spawn();
    }
  }

  // 弾
  for(const b of bullets){
    if(b.h){
      if(++b.l>110)b.dead=true;
      let tg=null,bd=1e9;
      for(const e of enemies){
        if(e.hp<=0||e.y<10)continue;
        const dx=e.x-b.x,dy=e.y-b.y,q=dx*dx+dy*dy;
        if(q<bd){bd=q;tg=e;}
      }
      if(tg){
        const sp=Math.hypot(b.vx,b.vy),ca=Math.atan2(b.vy,b.vx);
        let da=Math.atan2(tg.y-b.y,tg.x-b.x)-ca;
        da=Math.atan2(Math.sin(da),Math.cos(da));
        const na=ca+Math.max(-.12,Math.min(.12,da));
        b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      }
    }
    b.x+=b.vx;b.y+=b.vy;
  }
  bullets=bullets.filter(b=>!b.dead&&b.y>-20&&b.x>-20&&b.x<W+20);
  for(const b of ebul){b.x+=b.vx;b.y+=b.vy;}
  ebul=ebul.filter(b=>b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);

  // 敵
  const bsp=Math.min(4.2,2.6+stage*.15);
  for(const e of enemies){
    e.age++;if(e.hit>0)e.hit--;
    if(e===boss){
      if(e.y<110)e.y+=1.2;
      else{
        e.x=W/2+Math.sin(e.age*.018)*105;e.y=110+Math.sin(e.age*.03)*14;
        if(--e.sh<=0){
          e.sh=Math.max(40,85-stage*7)*D.efire;
          const n=Math.min(13,5+stage*2);
          for(let i=0;i<n;i++)ebullet(e.x,e.y+30,Math.PI/2+(i-(n-1)/2)*.28,bsp);
          if(e.age%2===0)for(let i=-1;i<=1;i++)ebullet(e.x,e.y+30,aimAt(e.x,e.y)+i*.12,bsp+.8,6);
        }
      }
      continue;
    }
    const T=TYPES[e.k];
    e.y+=e.sp;
    if(T.mv==='sine')e.x+=Math.sin(e.age*T.f)*T.a;
    else if(T.mv==='home')e.x+=Math.max(-T.h,Math.min(T.h,P.x-e.x));
    else if(T.mv==='side'){e.x+=e.dir*T.h;if(e.x<20||e.x>W-20)e.dir=-e.dir;}
    else if(T.mv==='dive'){
      if(e.y>130&&!e.dv){e.dv=1;e.sp*=2.2;}
      if(e.dv)e.x+=Math.max(-T.h,Math.min(T.h,P.x-e.x));
    }
    e.x=Math.max(10,Math.min(W-10,e.x));
    if(T.sh&&e.y>0&&e.y<H*.62&&--e.sh<=0){
      e.sh=Math.max(55,T.sh-stage*6)*D.efire;
      const a=aimAt(e.x,e.y),s=Math.min(3.8,2.5+stage*.1);
      if(T.shot==='fan3')for(let i=-1;i<=1;i++)ebullet(e.x,e.y+10,a+i*.3,s);
      else ebullet(e.x,e.y+10,a,s);
    }
  }

  // 弾 vs 敵
  for(const b of bullets){
    if(b.dead)continue;
    for(const e of enemies){
      if(e.hp<=0||e.y<5)continue;
      const dx=b.x-e.x,dy=b.y-e.y,rr=e.r+b.r;
      if(dx*dx+dy*dy<rr*rr){
        e.hp-=b.dmg;e.hit=4;b.dead=true;
        if(e.hp>0)sfx.hit();
        else kill(e);
        break;
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  enemies=enemies.filter(e=>e.hp>0&&e.y<H+40);

  // 敵 vs プレイヤー
  const hr=8;
  for(const e of enemies){
    const dx=P.x-e.x,dy=P.y-e.y,rr=e.r*.85+hr;
    if(dx*dx+dy*dy<rr*rr&&P.inv<=0){
      hurt();
      if(e!==boss){e.hp=0;explode(e.x,e.y,10);}
      break;
    }
  }
  enemies=enemies.filter(e=>e.hp>0);
  for(const b of ebul){
    const dx=P.x-b.x,dy=P.y-b.y,rr=b.r+hr;
    if(dx*dx+dy*dy<rr*rr&&P.inv<=0){hurt();break;}
  }
  if(state!=='play')return;

  // アイテム
  for(const it of items){
    it.y+=it.vy;it.age++;
    const dx=P.x-it.x,dy=P.y-it.y;
    if(dx*dx+dy*dy<32*32){it.dead=true;pickup(it);}
  }
  items=items.filter(i=>!i.dead&&i.y<H+30);
}

/* ---------- 描画 ---------- */
function txt(s,x,y,size,fill,align,stroke,lw){
  ctx.font='bold '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=lw||4;ctx.strokeStyle=stroke||'#000';
  ctx.strokeText(s,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y);
}
function emo(e,x,y,s){ctx.font=s+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,x,y);}

function sky(s,alpha){
  const c=th(s).g,g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,c[0]);g.addColorStop(.45,c[1]);g.addColorStop(.55,c[2]);g.addColorStop(1,c[3]);
  ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
}
function drawBg(){
  const f=bgFade>0?1-bgFade/60:1;
  if(bgFade>0)sky(prevStage,1);
  sky(stage,f);
  for(const d of deco){ctx.globalAlpha=d.a*f;emo(d.e,d.x,d.y,d.s);}
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const blink=P.inv>0&&Math.floor(P.inv/4)%2===0;
  ctx.globalAlpha=blink?.35:1;
  drawFace(P.who,P.x,P.y,25);
  ctx.globalAlpha=1;
  if(P.shield){
    ctx.beginPath();ctx.arc(P.x,P.y,33+Math.sin(frame*.15)*1.5,0,7);
    ctx.fillStyle='rgba(125,255,176,.22)';ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#7dffb0';ctx.stroke();
  }
  txt(CHAR[P.who].name,P.x,P.y+37,11,CHAR[P.who].color,'center','#000',3);
}
function drawBullet(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
  ctx.fillStyle=CHAR[b.k].color;ctx.fillRect(-2.5,-9,5,16);
  ctx.fillStyle='#fff';ctx.fillRect(-1,-9,2,16);
  ctx.beginPath();ctx.moveTo(-3,-9);ctx.lineTo(3,-9);ctx.lineTo(0,-16);ctx.closePath();
  ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}
function drawHud(){
  txt('SCORE '+score,10,22,20,'#fff','left');
  txt('STAGE '+stage,W/2+30,22,14,'#ffd23f','left','#000',3);
  txt('HI '+hi,10,44,13,'#ffe9a8','left','#000',3);
  for(let i=0;i<P.life;i++)emo('❤️',20+i*24,70,20);
  let s='';for(let i=0;i<5;i++)s+=i<P.power?'★':'☆';
  txt('POW '+s,W-10,70,14,'#ffd23f','right','#000',3);
  // 状態アイコン(連射・バリア・ホーミング)
  let sx=10;
  if(P.spd>1){txt('れんしゃ×'+P.spd,sx,96,13,'#7fe0ff','left','#000',3);sx+=74;}
  if(P.shield){txt('バリア',sx,96,13,'#7dffb0','left','#000',3);sx+=48;}
  if(P.homing>0)txt('ホーミング '+Math.ceil(P.homing/60)+'s',sx,96,13,'#ff9ad5','left','#000',3);
  if(boss&&boss.y>0){
    const w=240,x=(W-w)/2,y=118;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x-2,y-2,w+4,12);
    ctx.fillStyle='#ff4d4d';ctx.fillRect(x,y,w*Math.max(0,boss.hp)/boss.max,8);
  }
}
function drawScene(){
  drawBg();
  for(const it of items){
    const bob=Math.sin(it.age*.15)*2;
    emo(ITEM_E[it.type],it.x,it.y+bob,26);
  }
  for(const e of enemies){
    ctx.globalAlpha=e.hit>0?.5:1;
    emo(e.e,e.x,e.y,e.r*2.1);
  }
  ctx.globalAlpha=1;
  for(const b of bullets)drawBullet(b);
  for(const b of ebul){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle='#ff3b30';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  }
  if(state==='play'||(state==='over'&&P.life>0))drawPlayer();
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.min(1,p.life/(p.max*.3));txt(p.s,p.x,p.y,p.size,p.c);}
  ctx.globalAlpha=1;
}
function drawTitle(){
  const bob=Math.sin(t*.07)*6;
  txt('SYU & RYO',W/2,92,46,'#fff','center','#2e7d32',8);
  txt('サボテン大作戦',W/2,148,34,'#ffd23f','center','#8a4b00',7);
  drawFace('syu',W/2-70,236+bob,54);
  drawFace('ryo',W/2+70,236-bob,54);
  txt('SYU',W/2-70,300,18,CHAR.syu.color,'center','#000',4);
  txt('RYO',W/2+70,300,18,CHAR.ryo.color,'center','#000',4);
  txt('ひろがるトゲ',W/2-70,320,12,'#fff','center','#000',3);
  txt('まっすぐ れんしゃ',W/2+70,320,12,'#fff','center','#000',3);
  // 難易度ボタン
  txt('むずかしさ',W/2,350,13,'#fff','center','#000',3);
  for(let i=0;i<3;i++){
    const k=DKEYS[i],x=28+i*104,sel=k===diff;
    ctx.fillStyle=sel?DIFFS[k].color:'rgba(0,0,0,.45)';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,362,96,36,18);else ctx.rect(x,362,96,36);ctx.fill();
    if(sel){ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}
    txt(DIFFS[k].name,x+48,381,15,sel?'#fff':'#ddd','center',sel?'#000':'rgba(0,0,0,0)',sel?3:0);
  }
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(30,414,W-60,92,14);else ctx.rect(30,414,W-60,92);ctx.fill();
  txt('ゆびをドラッグして いどう・じどうで はっしゃ',W/2,434,13,'#fff','center','#000',3);
  txt('アイテムで パワーアップ！(⭐⚡🛡️💣🎯)',W/2,458,13,'#ffe9a8','center','#000',3);
  txt('ボスをたおして つぎのステージへ！',W/2,482,13,'#ffe9a8','center','#000',3);
  if(Math.floor(t/30)%2===0)txt('SYU か RYO を タップ！',W/2,550,26,'#fff','center','#d32f2f',6);
  txt('HI SCORE ('+D.name+') '+hi,W/2,598,15,'#fff','center','#000',3);
}
function drawOver(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
  txt('GAME OVER',W/2,170,46,'#ff5a5f','center','#fff',7);
  drawFace(P.who,W/2,262,48);
  txt('['+D.name+']',W/2,322,16,D.color,'center','#000',4);
  txt('STAGE '+stage+'  SCORE '+score,W/2,350,26,'#fff','center','#000',5);
  if(newRecord)txt('NEW RECORD!!',W/2,392,26,'#ffd23f','center','#000',5);
  else txt('HI '+hi,W/2,392,20,'#ffe9a8','center','#000',4);
  if(t>50&&Math.floor(t/30)%2===0)txt('TAPで もういちど',W/2,480,26,'#fff','center','#000',5);
}
function draw(){
  ctx.setTransform(cScale,0,0,cScale,0,0);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*.7,(Math.random()-.5)*shake*.7);
  drawScene();
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash/18*.8)+')';ctx.fillRect(0,0,W,H);}
  if(state==='play')drawHud();
  if(state==='title')drawTitle();
  if(state==='over')drawOver();
  if(paused&&state==='play'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    txt('PAUSE',W/2,H/2-20,44,'#fff');
    txt('TAPで さいかい',W/2,H/2+30,22,'#fff');
  }
}

/* ---------- ループ ---------- */
let last=performance.now(),acc=0;
function loop(now){
  requestAnimationFrame(loop);
  let d=now-last;last=now;if(d>100)d=100;
  acc+=d;
  while(acc>=16.667){update();acc-=16.667;}
  setTrack(state==='play'&&!paused?(boss&&clearT===0?3:(stage-1)%3):-1);
  draw();
}
requestAnimationFrame(loop);
})();
</script>
